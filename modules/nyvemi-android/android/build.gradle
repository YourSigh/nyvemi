plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.nyvemi.nativebridge'
version = '0.1.0'
android {
  namespace 'app.nyvemi.nativebridge'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  implementation 'androidx.core:core-ktx:1.16.0'
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}

def qwenSource = file('src/main/qwen')
def qwenWork = layout.buildDirectory.dir('qwen').get().asFile
def qwenAssets = new File(qwenWork, 'assets')
def qwenModel = providers.gradleProperty('nyvemiQwenModel').map { rootProject.file(it) }
def qwenAbi = 'arm64-v8a'
def includesQwenAbi = providers.gradleProperty('reactNativeArchitectures')
  .map { it.split(',').collect { abi -> abi.trim() }.contains(qwenAbi) }.getOrElse(true)

if (qwenModel.isPresent() && !includesQwenAbi) {
  throw new GradleException('The bundled Qwen voice pack requires arm64-v8a.')
}

if (includesQwenAbi) {
  def prepareQwen = tasks.register('prepareQwen', Exec) {
    inputs.files(fileTree(qwenSource) { include 'prepare.sh', '*.patch' })
    outputs.dirs(new File(qwenWork, 'speech'), new File(qwenAssets, 'licenses'))
    commandLine 'bash', new File(qwenSource, 'prepare.sh'), qwenWork
  }

  def buildQwen = tasks.register('buildQwen', Exec) {
    dependsOn prepareQwen
    inputs.dir qwenSource
    inputs.dir new File(qwenWork, 'speech')
    def libs = new File(qwenWork, "jni/${qwenAbi}")
    outputs.dir libs
    doFirst {
      def ndk = new File(android.sdkDirectory, "ndk/${rootProject.ext.ndkVersion}")
      def cmake = new File(android.sdkDirectory, 'cmake/3.22.1')
      commandLine 'bash', new File(qwenSource, 'build.sh'), qwenWork, ndk, cmake, qwenAbi, libs
    }
  }

  def stageQwenModel = tasks.register('stageQwenModel', Exec) {
    inputs.files(new File(qwenSource, 'stage-model.sh'), new File(qwenSource, 'model-license.txt'))
    if (qwenModel.isPresent()) inputs.file qwenModel
    outputs.dir new File(qwenAssets, 'qwen')
    commandLine 'bash', new File(qwenSource, 'stage-model.sh'), qwenAssets,
      qwenModel.map { it.absolutePath }.getOrElse('')
  }

  android.sourceSets.main.jniLibs.srcDir new File(qwenWork, 'jni')
  android.sourceSets.main.assets.srcDir qwenAssets
  tasks.named('preBuild').configure { dependsOn buildQwen, stageQwenModel }
}
