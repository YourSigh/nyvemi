plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'app.nyvemi.nativebridge'
version = '0.1.0'
android {
  namespace 'app.nyvemi.nativebridge'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  implementation 'androidx.core:core-ktx:1.16.0'
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}

def speechOutput = layout.buildDirectory.dir('generated/nyvemiSpeech')
def speechCache = gradle.gradleUserHomeDir.toPath().resolve('nyvemi-speech').toFile()
def speechScript = file('../../../scripts/speech/prepare.py')
def speechCatalog = file('../../../src/speech/catalog.json')
def expandedSpeechCatalog = file('../../../src/speech/expanded-catalog.json')
def prepareSpeech = tasks.register('prepareNyvemiSpeech', Exec) {
  inputs.files(speechScript, speechCatalog, expandedSpeechCatalog)
  outputs.dir(speechOutput)
  commandLine 'python3', speechScript, speechOutput.get().asFile, speechCache, speechCatalog, expandedSpeechCatalog
}
android.sourceSets.main.assets.srcDir(speechOutput.map { it.dir('assets') })
android.sourceSets.main.jniLibs.srcDir(speechOutput.map { it.dir('jni') })
tasks.named('preBuild').configure { dependsOn(prepareSpeech) }
dependencies {
  implementation files(speechOutput.map { it.file('classes.jar') }).builtBy(prepareSpeech)
}
